kind = "web"
previewPath = "/"
title = "Life Finance Simulator"
version = "1.0.0"
id = "artifacts/life-finance-simulator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21860

[services.development]
run = "pnpm --filter @workspace/life-finance-simulator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/life-finance-simulator", "run", "build" ]
publicDir = "artifacts/life-finance-simulator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21860"
BASE_PATH = "/"
