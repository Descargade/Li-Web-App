<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Fondo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Gradiente financiero -->
    <linearGradient id="finance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="256" height="256" rx="56" fill="url(#bg)" />

  <!-- Gráfico ascendente -->
  <path
    d="M52 168
       L92 138
       L124 154
       L168 102
       L204 74"
    fill="none"
    stroke="url(#finance)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Puntos -->
  <circle cx="52" cy="168" r="8" fill="#4ADE80"/>
  <circle cx="92" cy="138" r="8" fill="#4ADE80"/>
  <circle cx="124" cy="154" r="8" fill="#2DD4BF"/>
  <circle cx="168" cy="102" r="8" fill="#38BDF8"/>
  <circle cx="204" cy="74" r="8" fill="#7DD3FC"/>

  <!-- Flecha -->
  <path
    d="M186 72 L208 72 L208 94"
    fill="none"
    stroke="#7DD3FC"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Detalle circular -->
  <circle
    cx="128"
    cy="128"
    r="84"
    stroke="rgba(255,255,255,0.05)"
    stroke-width="2"
    fill="none"
  />
</svg>
